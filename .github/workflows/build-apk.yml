name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  GODOT_RELEASE: "stable"
  EXPORT_NAME: "SuperShooterHybrid"
  ANDROID_NDK_VERSION: "23.2.8568313"

jobs:
  # ── Job 1: Python unit tests ─────────────────────────────────────────────
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          python -m pytest tests/test_game_logic.py -v 2>/dev/null || python tests/test_game_logic.py

  # ── Job 2: Build Android APK ──────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Java 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Android NDK (SDK is pre-installed on ubuntu-latest) ───────────────
      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Install only NDK — build-tools and platforms are already present
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "build-tools;34.0.0" \
            "platforms;android-34" 2>&1 | tail -5
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # ── Debug keystore ────────────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "${{ github.workspace }}/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -J-Dfile.encoding=UTF-8
          echo "DEBUG_KEYSTORE=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV

      # ── Godot engine binary ───────────────────────────────────────────────
      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -e
          URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64.zip"
          curl -fsSL "$URL" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64"
          sudo mv "Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64" /usr/local/bin/godot
          godot --version

      # ── Export templates ──────────────────────────────────────────────────
      - name: Download export templates
        run: |
          set -e
          TMPL_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_export_templates.tpz"
          curl -fsSL "$TMPL_URL" -o templates.tpz
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.tpz -d /tmp/godot_tpl
          mv /tmp/godot_tpl/templates/* "$TEMPLATES_DIR/"
          ls "$TEMPLATES_DIR/" | grep android || echo "Templates dir contents:"

      # ── Godot editor settings (Android SDK paths) ─────────────────────────
      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "${{ env.DEBUG_KEYSTORE }}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          cat "$HOME/.config/godot/editor_settings-4.tres"

      # ── Update export_presets.cfg keystore path ────────────────────────────
      - name: Patch export_presets.cfg
        run: |
          sed -i "s|keystore/debug=\"res://debug.keystore\"|keystore/debug=\"${{ env.DEBUG_KEYSTORE }}\"|g" export_presets.cfg
          grep "keystore/debug" export_presets.cfg

      # ── First run to generate .godot/ cache ───────────────────────────────
      - name: Import project
        run: |
          mkdir -p build
          timeout 90 godot --headless --editor --import --quit 2>&1 | tail -20 || true
          ls -la .godot/ 2>/dev/null || echo "No .godot dir (normal for some setups)"

      # ── Export APK ────────────────────────────────────────────────────────
      - name: Export Android APK (debug)
        run: |
          mkdir -p build
          godot \
            --headless \
            --export-debug "Android" \
            "${{ github.workspace }}/build/${{ env.EXPORT_NAME }}.apk" \
            2>&1 | tee export.log
          echo ""
          echo "=== Build output ==="
          find . -name "*.apk" 2>/dev/null | xargs ls -lh 2>/dev/null || echo "No APK found yet"

      - name: Check APK result
        run: |
          if find . -name "*.apk" | grep -q .; then
            echo "SUCCESS: APK(s) found:"
            find . -name "*.apk" -exec ls -lh {} \;
          else
            echo "WARNING: APK not found. Export log:"
            cat export.log
            echo ""
            echo "Trying gradle build directly..."
            ls android/build/ 2>/dev/null || true
          fi

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SuperShooterHybrid-debug-apk
          path: |
            build/*.apk
            android/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload export log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-log
          path: export.log

  # ── Job 3: Release on tag ────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SuperShooterHybrid-debug-apk
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
