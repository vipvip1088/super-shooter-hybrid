name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  GODOT_RELEASE: "stable"

jobs:
  # ── Job 1: Python unit tests ─────────────────────────────────────────────
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run game logic tests
        run: python tests/test_game_logic.py
      - name: Run GDScript integrity tests
        run: python tests/test_gdscript_integrity.py

  # ── Job 2: Build Android APK ──────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Java 17 (нужна для подписи APK) ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Debug keystore ────────────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "DEBUG_KEYSTORE=$GITHUB_WORKSPACE/debug.keystore" >> $GITHUB_ENV

      # ── Godot engine binary ───────────────────────────────────────────────
      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64.zip"
          curl -fsSL "$URL" -o godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64" /usr/local/bin/godot
          godot --version

      # ── Export templates (содержат android_debug.apk / android_release.apk) ─
      - name: Download export templates
        run: |
          TMPL_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_export_templates.tpz"
          curl -fsSL "$TMPL_URL" -o templates.tpz
          TDIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}"
          mkdir -p "$TDIR"
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TDIR/"
          echo "Android templates:"
          ls "$TDIR/" | grep -i android

      # ── Godot editor settings (Android SDK + keystore) ────────────────────
      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << 'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = ""
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # patch keystore path (heredoc не раскрывает $GITHUB_ENV переменные)
          sed -i "s|export/android/debug_keystore = \"\"|export/android/debug_keystore = \"$DEBUG_KEYSTORE\"|" \
            "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      # ── patch export_presets.cfg: абсолютный путь к keystore ─────────────
      - name: Patch export_presets.cfg
        run: |
          sed -i "s|keystore/debug=\"res://debug.keystore\"|keystore/debug=\"$DEBUG_KEYSTORE\"|" export_presets.cfg
          grep "keystore/debug=" export_presets.cfg

      # ── Pre-import: Godot генерирует .godot/ кэш ─────────────────────────
      - name: Import assets
        run: |
          godot --headless --verbose --editor --quit-after 10 2>&1 | tail -20 || true
          ls -la .godot/ 2>/dev/null && echo "Cache OK" || echo "No cache dir"

      # ── Export APK (use_gradle_build=false → использует шаблон из .tpz) ──
      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose \
            --export-debug "Android" \
            build/android/super-shooter-hybrid.apk \
            2>&1 | tee export.log
          echo "--- APK search ---"
          find . -name "*.apk" 2>/dev/null | xargs ls -lh 2>/dev/null || echo "No APK"

      - name: Verify APK
        run: |
          APK="build/android/super-shooter-hybrid.apk"
          if [ -f "$APK" ]; then
            echo "SUCCESS: $(ls -lh $APK)"
          else
            echo "FAILED. Export log:" && cat export.log && exit 1
          fi

      # ── Upload APK ────────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SuperShooterHybrid-debug-apk
          path: build/android/super-shooter-hybrid.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload export log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-log
          path: export.log

  # ── Job 3: Release on tag ────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SuperShooterHybrid-debug-apk
          path: release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
