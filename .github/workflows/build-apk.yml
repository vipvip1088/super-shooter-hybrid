name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  GODOT_RELEASE: "stable"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "23.2.8568313"
  EXPORT_NAME: "SuperShooterHybrid"

jobs:
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python tests/test_game_logic.py

  build-apk:
    name: Build Android APK
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Java 17 ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools & NDK
        run: |
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_SDK_VERSION }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "cmdline-tools;latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # ── Debug keystore ────────────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=$(pwd)/debug.keystore" >> $GITHUB_ENV

      # ── Godot engine ──────────────────────────────────────────────────────
      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64.zip"
          curl -L "$GODOT_URL" -o godot.zip
          unzip godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64 /usr/local/bin/godot
          godot --version

      # ── Godot export templates ────────────────────────────────────────────
      - name: Download Godot Android export templates
        run: |
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_export_templates.tpz"
          curl -L "$TEMPLATES_URL" -o templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          unzip templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      # ── Configure Godot Android settings ─────────────────────────────────
      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "${{ env.KEYSTORE_PATH }}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

      # ── Gradle build setup ────────────────────────────────────────────────
      - name: Import Godot project (generate gradle build files)
        run: |
          mkdir -p build
          timeout 60 godot --headless --editor --quit --path . 2>/dev/null || true

      - name: Download Godot Android library (AAR)
        run: |
          AAR_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/godot-lib.${{ env.GODOT_VERSION }}.stable.template_release.aar"
          AAR_DEBUG_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/godot-lib.${{ env.GODOT_VERSION }}.stable.template_debug.aar"
          LIBS_DIR="android/build/libs/release"
          DEBUG_DIR="android/build/libs/debug"
          mkdir -p "$LIBS_DIR" "$DEBUG_DIR"
          curl -L "$AAR_URL" -o "$LIBS_DIR/godot-lib.template_release.aar" || true
          curl -L "$AAR_DEBUG_URL" -o "$DEBUG_DIR/godot-lib.template_debug.aar" || true

      # ── Export APK ────────────────────────────────────────────────────────
      - name: Export Android APK
        run: |
          mkdir -p build
          godot \
            --headless \
            --export-debug "Android" \
            "build/${{ env.EXPORT_NAME }}.apk" \
            --path . \
            2>&1 | tee export.log
          echo "=== Export log ==="
          cat export.log

      - name: Verify APK exists
        run: |
          ls -lh build/
          test -f "build/${{ env.EXPORT_NAME }}.apk" && echo "APK build SUCCESS" || echo "APK not found, checking alternatives..."
          find . -name "*.apk" 2>/dev/null | head -20

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperShooterHybrid-debug-apk
          path: |
            build/*.apk
            android/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log

  release:
    name: Create Release (on tag)
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SuperShooterHybrid-debug-apk
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
